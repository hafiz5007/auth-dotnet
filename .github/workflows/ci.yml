name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AuthReference.sln

      - name: Build
        run: dotnet build AuthReference.sln -c Release --no-restore

      # Tests run on EF Core InMemory + in-memory fakes — no Postgres/Redis needed.
      - name: Test
        run: dotnet test AuthReference.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
